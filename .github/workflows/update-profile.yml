name: Update GitHub Profile

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual execution from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        run: |
          python scripts/fetch_contributions.py

      - name: Generate contribution SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json assets/contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update contribution graph"
          git push
