<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">

  <rect width="700" height="360" rx="18" fill="#0d1117"/>

  <!-- Terminal header -->
  <circle cx="25" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="25" r="6" fill="#27c93f"/>

  <text x="90" y="31"
        font-family="monospace"
        font-size="14"
