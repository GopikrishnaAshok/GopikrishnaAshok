  </text>

  <text x="30" y="328"
        font-family="monospace"
        font-size="15"
        fill="#c9d1d9">
    AWS + DevOps + Generative AI
  </text>

  <!-- Cursor -->
  <rect x="345" y="315" width="9" height="17" fill="#58a6ff">
    <animate
