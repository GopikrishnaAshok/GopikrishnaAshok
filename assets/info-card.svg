  </text>

  <text x="30" y="266"
        font-family="monospace"
        font-size="15"
        fill="#c9d1d9">
    GenAI       RAG           Microservices
  </text>

  <!-- Current focus -->
  <text x="30" y="300"
        font-family="monospace"
        font-size="15"
