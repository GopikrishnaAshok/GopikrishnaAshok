  </text>

  <!-- Divider -->
  <line x1="30" y1="150" x2="670" y2="150"
        stroke="#30363d"/>

  <!-- Skills -->
  <text x="30" y="180"
        font-family="monospace"
        font-size="15"
        fill="#58a6ff">
